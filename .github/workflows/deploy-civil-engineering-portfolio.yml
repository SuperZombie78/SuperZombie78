name: Deploy civil engineering portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: |
          if [ "${GITHUB_REPOSITORY#*/}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            GITHUB_PAGES_BASE_PATH="/" pnpm --filter @workspace/civil-engineering-portfolio run build
          else
            REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
            GITHUB_PAGES_BASE_PATH="/${REPOSITORY_NAME}/" pnpm --filter @workspace/civil-engineering-portfolio run build
          fi
        env:
          PORT: 4173

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/civil-engineering-portfolio/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
